workflows:
  android-workflow:
    name: Build APK
    instance_type: linux
    max_build_duration: 120
    
    triggering:
      events:
        - push
        - pull_request
    
    environment:
      java: 17
      groups:
        - android_credentials
    
    scripts:
      - name: Checkout
        script: |
          git clone https://github.com/$GITHUB_REPOSITORY.git .
          git fetch origin $GITHUB_REF
          git checkout $GITHUB_REF
      
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean assembleDebug
      
      - name: Copy APK
        script: |
          mkdir -p build_artifacts
          cp app/build/outputs/apk/debug/*.apk build_artifacts/ || true
    
    artifacts:
      - build_artifacts/**/*.apk
    
    publishing:
      email:
        recipients:
          - torkashvand611@gmail.com
        notify:
          success: true
          failure: true
