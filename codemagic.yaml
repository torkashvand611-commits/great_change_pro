workflows:
  android-workflow:
    name: Build APK
    instance_type: linux_x2
    max_build_duration: 120
    
    triggering:
      events:
        - push
        - pull_request
    
    environment:
      java: 17
      xcode: latest
      groups:
        - android_credentials
    
    scripts:
      - name: Checkout
        script: |
          git clone https://github.com/$GITHUB_REPOSITORY.git .
          git fetch origin $GITHUB_REF
          git checkout $GITHUB_REF
      
      - name: Set up JDK 17
        script: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
      
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean assembleDebug
      
      - name: Upload APK
        script: |
          cp app/build/outputs/apk/debug/*.apk GreatChangePro-debug.apk || true
    
    artifacts:
      - build/**/*.apk
    
    publishing:
      email:
        recipients:
          - torkashvand611@gmail.com
        notify:
          success: true
          failure: true
